<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#01000b"/>
  <title>For Nabila 💖 | My Universe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Hind+Siliguri:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body {
      width:100%; height:100%; overflow:hidden;
      background:#01000b; font-family:'Outfit', sans-serif;
      user-select:none; -webkit-user-select:none;
    }

    /* ── Flash effect on assembly ────────────────────── */
    #flash {
      position:fixed; inset:0; pointer-events:none; z-index:9;
      background: radial-gradient(circle at 50% 34%, rgba(255,160,240,.65) 0%, rgba(180,70,255,.28) 45%, transparent 75%);
      opacity:0; transition:opacity 1.1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ── Floating Music Button ───────────────────────── */
    #musicBtn {
      position:fixed;
      top: max(16px, env(safe-area-inset-top, 16px));
      right: max(16px, env(safe-area-inset-right, 16px));
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(22, 10, 38, 0.65);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 180, 230, 0.35);
      color: #ffc4e8;
      display: flex; align-items: center; justify-content: center;
      font-size: 19px; cursor: pointer; z-index: 30;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 15px rgba(255,130,210,0.2);
      transition: all .35s ease;
      pointer-events: auto;
    }
    #musicBtn:hover, #musicBtn:active {
      transform: scale(1.08);
      border-color: rgba(255, 210, 245, 0.7);
      box-shadow: 0 0 25px rgba(255, 140, 220, 0.5);
    }
    #musicBtn.playing {
      border-color: #ff7ecd;
      box-shadow: 0 0 25px rgba(255, 126, 205, 0.65);
      animation: musicPulse 2.2s infinite ease-in-out;
    }
    @keyframes musicPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.09); }
    }

    /* ── Romantic UI Overlay (Pinned to lower viewport) ─ */
    #ui {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      padding: 0 16px max(18px, env(safe-area-inset-bottom, 16px));
      pointer-events: none;
      z-index: 10;
      width: 100%;
    }

    .sub {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(15px, 4.2vw, 24px);
      font-weight: 700;
      color: rgba(255, 225, 245, 0);
      letter-spacing: 3px;
      text-shadow: 0 0 25px rgba(255, 150, 220, 0.9), 0 0 50px rgba(210, 90, 255, 0.6);
      transition: color 2.5s ease, letter-spacing 2.5s ease, transform 2.5s ease;
      transform: translateY(18px);
      text-align: center;
      margin-bottom: 12px;
      white-space: nowrap;
    }
    .sub.on {
      color: rgba(255, 240, 250, 0.96);
      letter-spacing: clamp(4px, 1.8vw, 8px);
      transform: translateY(0);
    }

    .card {
      width: 100%;
      max-width: 470px;
      background: rgba(18, 9, 32, 0.58);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 175, 225, 0.28);
      border-radius: 22px;
      padding: clamp(14px, 3.8vw, 22px) clamp(16px, 4.5vw, 28px);
      text-align: center;
      opacity: 0;
      transform: translateY(28px) scale(0.95);
      transition: opacity 2.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s, 
                  transform 2.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s;
      box-shadow: 0 12px 45px rgba(0, 0, 0, 0.65), 
                  0 0 60px rgba(240, 90, 190, 0.16), 
                  inset 0 1px 1px rgba(255, 255, 255, 0.18);
      pointer-events: auto;
    }
    .card.on {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .love-text {
      font-family: 'Hind Siliguri', sans-serif;
      font-size: clamp(13px, 3.6vw, 16px);
      font-weight: 500;
      color: rgba(255, 240, 252, 0.95);
      line-height: 1.85;
      text-shadow: 0 0 15px rgba(255, 140, 210, 0.45);
      margin: 0;
    }
    .love-text-en {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(11.5px, 3.1vw, 14px);
      font-weight: 400;
      color: rgba(255, 215, 240, 0.88);
      letter-spacing: 0.5px;
      margin: 4px 0;
    }

    .card-footer {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 180, 225, 0.35);
      color: #ffe5f5;
      padding: 7px 20px;
      border-radius: 22px;
      font-family: 'Outfit', sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.8px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(10px);
    }
    .btn-action:hover, .btn-action:active {
      background: rgba(255, 140, 210, 0.28);
      border-color: rgba(255, 215, 245, 0.75);
      box-shadow: 0 0 20px rgba(255, 120, 205, 0.45);
      transform: scale(1.06);
    }

    /* ── Floating Romantic Hearts ─────────────────────── */
    .heart {
      position: fixed;
      pointer-events: none;
      z-index: 6;
      animation: heartDrift linear forwards;
      will-change: transform, opacity;
    }
    @keyframes heartDrift {
      0% { opacity: 0; transform: translateY(0) rotate(0deg) scale(0.8); }
      12% { opacity: 0.9; }
      85% { opacity: 0.7; }
      100% { opacity: 0; transform: translateY(-115vh) rotate(30deg) scale(0.6); }
    }

    /* ── Interactive Stardust Sparkles ────────────────── */
    .sparkle {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      z-index: 25;
      transform: translate(-50%, -50%);
      will-change: transform, opacity;
    }

    /* ── Media Queries for Ultra-Small Phones ──────────── */
    @media (max-width: 360px) {
      .card { padding: 12px 14px; border-radius: 16px; }
      .love-text { font-size: 12px; line-height: 1.7; }
      .sub { font-size: 14px; margin-bottom: 8px; }
      .btn-action { padding: 5px 14px; font-size: 11.5px; }
    }
  </style>
</head>
<body>

  <div id="flash"></div>

  <!-- Audio Toggle Button -->
  <button id="musicBtn" title="Play Romantic Melody" aria-label="Toggle Melody">🎵</button>

  <!-- UI Overlay -->
  <div id="ui">
    <div class="sub" id="sub">✨ &nbsp; My Universe &nbsp;·&nbsp; My Everything &nbsp; ✨</div>
    <div class="card" id="card">
      <p class="love-text">🌟 তুমি আমার আকাশের সবচেয়ে উজ্জ্বল তারা 🌟</p>
      <p class="love-text-en">Every star in this galaxy is shining just for you 💫</p>
      <p class="love-text">তোমাকে ভালোবাসি, সবসময়, সারাজীবন 💖</p>
      <div class="card-footer">
        <button id="replayBtn" class="btn-action">✨ Replay Galaxy</button>
      </div>
    </div>
  </div>

  <!-- Three.js + Postprocessing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <script>
  // ════════════════════════════════════════════════════════════════
  //   HYPER-REALISTIC GALAXY  →  "Nabila"  (100% Mobile Responsive)
  // ════════════════════════════════════════════════════════════════

  const TOTAL  = 26000;   // High-density starry galaxy
  const N_TEXT = 6800;    // Dense particles for crystal-clear name strokes

  // ── Renderer & Canvas ──────────────────────────────────────────
  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false,
    powerPreference: 'high-performance'
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.domElement.style.cssText = 'position:fixed;top:0;left:0;z-index:2;width:100%;height:100%;touch-action:none;';
  document.body.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x01000b); // Deepest cosmic dark navy

  // ── Camera (Centered & Perfectly Proportioned) ────────────────
  const camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.01, 1000);
  camera.position.set(0, 0, 6.2);
  camera.lookAt(0, 0, 0);

  // ── Post-Processing Bloom ──────────────────────────────────────
  let composer = null;
  try {
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    const bloom = new THREE.UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.85,  // tuned strength: radiant starlight without blurry washing out
      0.45,  // soft radius
      0.18   // threshold: crisp text with heavenly aura
    );
    composer.addPass(bloom);
  } catch(e) {
    composer = null;
  }

  // ══ VERTEX SHADER ══════════════════════════════════════════════
  const VERT = `
    attribute vec3  aGP;      // Initial galaxy position
    attribute vec3  aTP;      // Target text position ("Nabila")
    attribute float aPhase;   // Unique star twinkle & wobble phase
    attribute float aOff;     // Staggered convergence timing
    attribute float aSz;      // Intrinsic star size
    attribute vec3  aCol;     // Stellar spectral color
    attribute float aIsT;     // 1.0 = text star, 0.0 = ambient star
    attribute float aBr;      // Stellar luminosity

    uniform float uTime;
    uniform float uProg;      // 0.0 (Galaxy) → 1.0 (Nabila formed)

    varying vec3  vCol;
    varying float vAlpha;
    varying float vBr;

    // Smooth cubic ease-in-out
    float easeInOut(float t) {
      return t < 0.5 ? 4.0 * t * t * t : 1.0 - pow(-2.0 * t + 2.0, 3.0) * 0.5;
    }

    void main() {
      vCol = aCol;
      vBr  = aBr;

      // ── Galaxy Rotation (smoothly slows when text forms) ──
      float rotSpeed = 0.038 * (1.0 - uProg * 0.7);
      float angle = uTime * rotSpeed;
      float cr = cos(angle), sr = sin(angle);
      vec3 gp = vec3(
        aGP.x * cr - aGP.z * sr,
        aGP.y,
        aGP.x * sr + aGP.z * cr
      );

      // ── Living Organic Micro-Drift in Space ──
      float alive = 1.0 - uProg * 0.85;
      gp.x += cos(uTime * 0.45 + aPhase) * 0.022 * alive;
      gp.y += sin(uTime * 0.38 + aPhase * 1.3) * 0.015 * alive;
      gp.z += sin(uTime * 0.30 + aPhase * 2.1) * 0.020 * alive;

      vec3 finalPos;
      float starProgress = 0.0;

      if (aIsT > 0.5) {
        // ── Text Particles: Organic Celestial Swirl into "Nabila" ──
        float localP = clamp((uProg - aOff) / max(1.0 - aOff, 0.001), 0.0, 1.0);
        starProgress = easeInOut(localP);

        // Gentle swirl vortex during flight
        float swirl = (1.0 - starProgress) * starProgress * 3.14159 * 1.6;
        float cs = cos(swirl), ss = sin(swirl);
        vec3 swirledGP = vec3(
          gp.x * cs - gp.y * ss,
          gp.x * ss + gp.y * cs,
          gp.z
        );

        finalPos = mix(swirledGP, aTP, starProgress);

        // Subtle living pulse once the name is assembled
        float pulse = uProg * sin(uTime * 1.8 + aPhase) * 0.006;
        finalPos.x += pulse;
        finalPos.y += pulse * 0.6;
      } else {
        // ── Ambient Galaxy Stars: Stay in deep space as majestic background ──
        finalPos = gp;
      }

      // ── Stellar Scintillation (Twinkling Atmospheric Shimmer) ──
      float scint1 = 0.45 + 0.55 * sin(uTime * 2.8 + aPhase * 6.2);
      float scint2 = 0.50 + 0.50 * sin(uTime * 4.2 + aPhase * 3.1);
      float flick  = mix(scint1, scint2, 0.4);
      vAlpha = mix(flick * (0.35 + 0.65 * aBr), 0.98, starProgress * starProgress);

      // ── Star Point Sizing: Sharp, diamond-like, perspective-correct ──
      float targetScale = aIsT > 0.5 ? 1.5 : 0.85;
      float sz = aSz * mix(1.0, targetScale, starProgress);
      vec4 mv = modelViewMatrix * vec4(finalPos, 1.0);
      gl_PointSize = clamp(sz * (400.0 / -mv.z), 1.8, 16.0);
      gl_Position  = projectionMatrix * mv;
    }
  `;

  // ══ FRAGMENT SHADER ════════════════════════════════════════════
  const FRAG = `
    varying vec3  vCol;
    varying float vAlpha;
    varying float vBr;

    void main() {
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      if (d > 0.5) discard;

      // ── Physically-Based Celestial Star Glow ──
      float core  = exp(-d * d * 220.0);   // Blazing hot diamond core
      float inner = exp(-d * d * 38.0);    // Inner luminous halo
      float outer = exp(-d * d * 9.0);     // Soft atmospheric corona

      // ── 4-Point Airy Diffraction Spikes on Bright Stars ──
      float spike = 0.0;
      if (vBr > 0.55) {
        float sx = exp(-uv.x * uv.x * 650.0) * exp(-abs(uv.y) * 85.0);
        float sy = exp(-uv.y * uv.y * 650.0) * exp(-abs(uv.x) * 85.0);
        spike = (sx + sy) * (vBr - 0.5) * 0.6;
      }

      float a = (core * 1.05 + inner * 0.52 + outer * 0.18 + spike * 0.6) * vAlpha;
      // Core radiates brilliant pure diamond white
      vec3 col = mix(vCol, vec3(1.0, 1.0, 1.0), core * 0.88 + spike * 0.45);

      gl_FragColor = vec4(col, clamp(a, 0.0, 1.0));
    }
  `;

  // ── Galaxy Star Generator (Tilted Logarithmic Spiral) ─────────
  const TILT = 54 * Math.PI / 180;
  const cosT = Math.cos(TILT), sinT = Math.sin(TILT);
  function tiltCosmic(x, y, z) {
    return [
      x,
      y * cosT - z * sinT,
      y * sinT + z * cosT
    ];
  }

  function starPos() {
    const rng = Math.random();

    // 28% Galactic Bulge (dense luminous core)
    if (rng < 0.28) {
      const phi  = Math.random() * Math.PI * 2;
      const cosTheta = 2 * Math.random() - 1;
      const sinTheta = Math.sqrt(1 - cosTheta * cosTheta);
      const r = Math.pow(Math.random(), 2.3) * 1.35;
      const x = r * sinTheta * Math.cos(phi);
      const y = r * cosTheta * 0.42;
      const z = r * sinTheta * Math.sin(phi);
      return tiltCosmic(x, y, z);
    }

    // 62% Logarithmic Spiral Arms & Disk
    if (rng < 0.90) {
      const arm = (Math.random() * 2) | 0;
      const t = 0.25 + Math.random() * 3.8;
      const armOffset = arm * Math.PI;
      const angle = t * 1.32 + armOffset;
      const spread = (Math.random() - 0.5) * (0.24 + t * 0.10);
      const r = 0.52 * Math.exp(0.40 * t) + (Math.random() - 0.5) * 0.24;

      const x = Math.cos(angle + spread) * r;
      const z = Math.sin(angle + spread) * r;
      const y = (Math.random() - 0.5) * (0.16 + t * 0.045);
      return tiltCosmic(x, y, z);
    }

    // 10% Outer Halo & Cosmic Stardust
    const phi = Math.random() * Math.PI * 2;
    const ct  = 2 * Math.random() - 1, st = Math.sqrt(1 - ct * ct);
    const r   = 3.0 + Math.random() * 3.0;
    const x = r * st * Math.cos(phi);
    const y = r * ct * 0.5;
    const z = r * st * Math.sin(phi);
    return tiltCosmic(x, y, z);
  }

  // ── Realistic Stellar Classification Colors ──────────────────
  function starColor(pos) {
    const d = Math.sqrt(pos[0]*pos[0] + pos[1]*pos[1] + pos[2]*pos[2]);
    const u = Math.random();

    if (d < 1.0) {
      // Galactic core: warm golden, amber, old stars
      if (u < 0.50) return [[1.00, 0.92, 0.62], 0.50 + Math.random()*0.50];
      if (u < 0.78) return [[1.00, 0.78, 0.48], 0.40 + Math.random()*0.45];
      if (u < 0.90) return [[1.00, 0.64, 0.40], 0.30 + Math.random()*0.40];
      return              [[1.00, 0.98, 0.88], 0.60 + Math.random()*0.40];
    }
    // Disk & spiral arms: vibrant stellar variety
    if (u < 0.05) return [[0.60, 0.74, 1.00], 0.85 + Math.random()*0.15]; // O/B hot blue
    if (u < 0.15) return [[0.74, 0.85, 1.00], 0.65 + Math.random()*0.35]; // A blue-white
    if (u < 0.28) return [[0.92, 0.96, 1.00], 0.50 + Math.random()*0.40]; // F white
    if (u < 0.55) return [[1.00, 1.00, 0.96], 0.35 + Math.random()*0.45]; // G sun-like
    if (u < 0.72) return [[1.00, 0.88, 0.65], 0.25 + Math.random()*0.35]; // K orange
    if (u < 0.85) return [[1.00, 0.68, 0.45], 0.20 + Math.random()*0.30]; // M red giant
    if (u < 0.93) return [[0.80, 0.90, 1.00], 0.35 + Math.random()*0.35]; // Cyan nebula star
    return              [[1.00, 0.82, 0.92], 0.30 + Math.random()*0.40]; // Romantic rosy stardust
  }

  // Romantic palette for "Nabila" starlight particles
  const TC = [
    [1.00, 0.72, 0.88], // Rose quartz pink
    [1.00, 0.98, 1.00], // Pure diamond white
    [1.00, 0.86, 0.65], // Celestial champagne gold
    [0.86, 0.74, 1.00], // Soft lavender violet
    [0.72, 0.92, 1.00], // Aquamarine starlight
    [1.00, 0.60, 0.78], // Vibrant radiant pink
    [0.95, 0.80, 1.00], // Lilac glow
    [1.00, 0.94, 0.78], // Warm star gold
  ];

  // ── Text Sampling & Responsive Layout Engine ─────────────────
  let cachedTextData = null;

  function sampleTextExact(text) {
    const cw = 1400, ch = 450;
    const cv = document.createElement('canvas');
    cv.width = cw; cv.height = ch;
    const cx = cv.getContext('2d', { willReadFrequently: true });
    cx.fillStyle = '#fff';
    cx.font = '700 240px "Dancing Script", cursive, Georgia, serif';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    cx.fillText(text, cw / 2, ch / 2);

    const imgData = cx.getImageData(0, 0, cw, ch);
    const data = imgData.data;

    let minX = cw, maxX = 0, minY = ch, maxY = 0;
    const rawPts = [];
    for (let y = 0; y < ch; y += 2) {
      for (let x = 0; x < cw; x += 2) {
        const alpha = data[(y * cw + x) * 4 + 3];
        if (alpha > 70) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
          rawPts.push({ x, y, a: alpha / 255 });
        }
      }
    }

    const textW = Math.max(maxX - minX, 1);
    const textH = Math.max(maxY - minY, 1);
    const midX = (minX + maxX) / 2;
    const midY = (minY + maxY) / 2;

    // Normalized coordinates from -0.5 to +0.5 relative to text bounding center
    const normPts = [];
    for (let i = 0; i < rawPts.length; i++) {
      normPts.push([
        (rawPts[i].x - midX) / textW,
        (rawPts[i].y - midY) / textH,
        rawPts[i].a
      ]);
    }

    // Shuffle points for organic star distribution
    for (let i = normPts.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const temp = normPts[i];
      normPts[i] = normPts[j];
      normPts[j] = temp;
    }

    return { normPts, textAspect: textW / textH };
  }

  // Compute 3D target coordinates dynamically based on current viewport
  function computeTargetPositions(normPts, textAspect) {
    const isPortrait = window.innerWidth < window.innerHeight;
    const vFOVrad = (camera.fov * Math.PI) / 180;
    const halfH = camera.position.z * Math.tan(vFOVrad / 2);
    const halfW = halfH * camera.aspect;
    const visW = halfW * 2;
    const visH = halfH * 2;

    // Guaranteed responsive constraints:
    // Mobile Portrait: max 82% of screen width (9% margin left & right), max 20% of screen height
    // Desktop Landscape: max 52% of screen width, max 25% of screen height
    const maxW = isPortrait ? (visW * 0.82) : Math.min(visW * 0.52, visH * 0.85 * textAspect);
    const maxH = isPortrait ? (visH * 0.20) : (visH * 0.25);

    let targetW = maxW;
    let targetH = targetW / textAspect;
    if (targetH > maxH) {
      targetH = maxH;
      targetW = targetH * textAspect;
    }

    // Position "Nabila" in the upper sky (around 32% from top on mobile, 38% on desktop)
    // so the lower half has plenty of breathing room for subtitle and card
    const yOffset = isPortrait ? (halfH * 0.32) : (halfH * 0.22);

    const targets = [];
    for (let i = 0; i < N_TEXT; i++) {
      const pt = normPts[i % normPts.length];
      targets.push([
        pt[0] * targetW,
        -pt[1] * targetH + yOffset,
        (Math.random() - 0.5) * 0.035
      ]);
    }
    return targets;
  }

  // ── Build Scene & Geometry ───────────────────────────────────
  let mesh, mat, geo;

  function buildScene(targets) {
    const aGP  = new Float32Array(TOTAL * 3);
    const aTP  = new Float32Array(TOTAL * 3);
    const aCol = new Float32Array(TOTAL * 3);
    const aSz  = new Float32Array(TOTAL);
    const aPh  = new Float32Array(TOTAL);
    const aOff = new Float32Array(TOTAL);
    const aIsT = new Float32Array(TOTAL);
    const aBr  = new Float32Array(TOTAL);

    for (let i = 0; i < TOTAL; i++) {
      const i3 = i * 3;
      const isT = i < N_TEXT;
      const gp = starPos();

      aGP[i3]   = gp[0];
      aGP[i3+1] = gp[1];
      aGP[i3+2] = gp[2];

      if (isT && targets[i]) {
        aTP[i3]   = targets[i][0];
        aTP[i3+1] = targets[i][1];
        aTP[i3+2] = targets[i][2];

        const c = TC[(Math.random() * TC.length) | 0];
        aCol[i3]   = c[0];
        aCol[i3+1] = c[1];
        aCol[i3+2] = c[2];
        aBr[i]  = 0.75 + Math.random() * 0.25;
        aSz[i]  = 0.045 + Math.random() * 0.040;
        aOff[i] = Math.random() * 0.40;
        aIsT[i] = 1.0;
      } else {
        // Ambient background stars stay in the celestial galaxy
        aTP[i3]   = gp[0];
        aTP[i3+1] = gp[1];
        aTP[i3+2] = gp[2];

        const [c, bright] = starColor(gp);
        aCol[i3]   = c[0];
        aCol[i3+1] = c[1];
        aCol[i3+2] = c[2];
        aBr[i]  = bright;
        const u = Math.random();
        aSz[i]  = 0.012 + u * u * u * 0.080;
        aOff[i] = 0.0;
        aIsT[i] = 0.0;
      }

      aPh[i] = Math.random() * Math.PI * 2;
    }

    geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TOTAL * 3), 3));
    geo.setAttribute('aGP',    new THREE.BufferAttribute(aGP,  3));
    geo.setAttribute('aTP',    new THREE.BufferAttribute(aTP,  3));
    geo.setAttribute('aCol',   new THREE.BufferAttribute(aCol, 3));
    geo.setAttribute('aSz',    new THREE.BufferAttribute(aSz,  1));
    geo.setAttribute('aPhase', new THREE.BufferAttribute(aPh,  1));
    geo.setAttribute('aOff',   new THREE.BufferAttribute(aOff, 1));
    geo.setAttribute('aIsT',   new THREE.BufferAttribute(aIsT, 1));
    geo.setAttribute('aBr',    new THREE.BufferAttribute(aBr,  1));

    mat = new THREE.ShaderMaterial({
      vertexShader:   VERT,
      fragmentShader: FRAG,
      uniforms: {
        uTime: { value: 0 },
        uProg: { value: 0 }
      },
      transparent: true,
      depthWrite:  false,
      blending:    THREE.AdditiveBlending
    });

    mesh = new THREE.Points(geo, mat);
    mesh.frustumCulled = false;
    scene.add(mesh);

    addCosmicCoreSprite();
    addNebulaClouds();
  }

  // ── Glowing Core Sprite ──────────────────────────────────────
  let coreSprite = null;
  function addCosmicCoreSprite() {
    const cv = document.createElement('canvas');
    cv.width = cv.height = 512;
    const cx = cv.getContext('2d');

    // Outer lavender-magenta aura
    let g = cx.createRadialGradient(256, 256, 0, 256, 256, 256);
    g.addColorStop(0, 'rgba(230, 140, 255, 0.45)');
    g.addColorStop(0.45, 'rgba(150, 60, 230, 0.16)');
    g.addColorStop(1, 'rgba(0, 0, 0, 0)');
    cx.fillStyle = g; cx.fillRect(0, 0, 512, 512);

    // Warm golden-amber inner glow
    g = cx.createRadialGradient(256, 256, 0, 256, 256, 130);
    g.addColorStop(0, 'rgba(255, 245, 210, 0.90)');
    g.addColorStop(0.25, 'rgba(255, 205, 120, 0.70)');
    g.addColorStop(0.55, 'rgba(255, 150, 70, 0.30)');
    g.addColorStop(1, 'rgba(0, 0, 0, 0)');
    cx.fillStyle = g; cx.fillRect(0, 0, 512, 512);

    // Pure white central core
    g = cx.createRadialGradient(256, 256, 0, 256, 256, 38);
    g.addColorStop(0, 'rgba(255, 255, 255, 1)');
    g.addColorStop(1, 'rgba(0, 0, 0, 0)');
    cx.fillStyle = g; cx.fillRect(0, 0, 512, 512);

    coreSprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: new THREE.CanvasTexture(cv),
      blending: THREE.AdditiveBlending,
      transparent: true,
      depthWrite: false,
      opacity: 0.92
    }));
    coreSprite.scale.set(3.4, 1.6, 1);
    coreSprite.position.set(0, 0, -0.05);
    scene.add(coreSprite);
  }

  // ── Nebula Cloud Dust Layers ─────────────────────────────────
  let nebulaeGroup = new THREE.Group();
  function addNebulaClouds() {
    const makeNeb = (color, x, y, z, sx, sy) => {
      const cv = document.createElement('canvas');
      cv.width = cv.height = 256;
      const cx = cv.getContext('2d');
      const g = cx.createRadialGradient(128, 128, 0, 128, 128, 128);
      g.addColorStop(0, color);
      g.addColorStop(0.5, 'rgba(0,0,0,0.04)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      cx.fillStyle = g;
      cx.fillRect(0, 0, 256, 256);

      const pl = new THREE.Mesh(
        new THREE.PlaneGeometry(sx, sy),
        new THREE.MeshBasicMaterial({
          map: new THREE.CanvasTexture(cv),
          blending: THREE.AdditiveBlending,
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide
        })
      );
      pl.position.set(x, y, z);
      nebulaeGroup.add(pl);
    };

    makeNeb('rgba(140, 45, 225, 0.20)',   0.0,  0.0, -0.7, 5.8, 2.8); // Central cosmic violet
    makeNeb('rgba(25, 80, 220, 0.16)',   -2.4, -0.6, -0.8, 4.2, 2.1); // Deep blue arm
    makeNeb('rgba(220, 35, 115, 0.14)',   2.2,  0.5, -0.8, 3.8, 2.0); // Rosy magenta arm
    makeNeb('rgba(18, 145, 100, 0.10)',   0.2, -1.2, -0.9, 3.2, 1.6); // Emerald veil
    makeNeb('rgba(215, 75, 255, 0.10)',   1.4,  1.1, -0.8, 2.6, 1.4); // Violet wisp
    scene.add(nebulaeGroup);
  }

  // ── Responsive Resize Handler ────────────────────────────────
  function updateTextCoordinates() {
    if (!cachedTextData || !geo) return;
    const newTargets = computeTargetPositions(cachedTextData.normPts, cachedTextData.textAspect);
    const attr = geo.attributes.aTP;
    const arr = attr.array;
    for (let i = 0; i < N_TEXT; i++) {
      const i3 = i * 3;
      arr[i3]   = newTargets[i][0];
      arr[i3+1] = newTargets[i][1];
      arr[i3+2] = newTargets[i][2];
    }
    attr.needsUpdate = true;
  }

  function handleResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    updateTextCoordinates();
  }
  window.addEventListener('resize', handleResize);
  window.addEventListener('orientationchange', () => {
    setTimeout(handleResize, 150);
  });

  // ── Animation Timeline ───────────────────────────────────────
  const PHASE1 = 5.5;    // Galaxy rotates peacefully for 5.5s
  const PHASE2 = 12.5;   // Convergence completes smoothly at 12.5s

  let t0 = null;
  let formed = false;
  let animId = null;

  const smoothEase = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  function loop(ts) {
    animId = requestAnimationFrame(loop);
    if (!mesh) return;
    if (!t0) t0 = ts;

    const el = (ts - t0) / 1000;
    mat.uniforms.uTime.value = el;

    let prog = 0;
    if (el >= PHASE2) {
      prog = 1.0;
    } else if (el >= PHASE1) {
      prog = smoothEase((el - PHASE1) / (PHASE2 - PHASE1));
    }
    mat.uniforms.uProg.value = prog;

    // Gentle camera drift centered around (0, 0, 6.2)
    camera.position.x = Math.sin(el * 0.035) * 0.16;
    camera.position.y = Math.sin(el * 0.022) * 0.10;
    camera.lookAt(0, 0, 0);

    // Fade core sprite slightly as text forms so text letters shine through crisply
    if (coreSprite) {
      coreSprite.material.opacity = Math.max(0.35, 0.92 - prog * 0.52);
    }

    if (prog >= 1.0 && !formed) {
      formed = true;
      triggerRevealSequence();
    }

    if (composer) composer.render();
    else renderer.render(scene, camera);
  }

  function triggerRevealSequence() {
    const fl = document.getElementById('flash');
    fl.style.opacity = '1';
    setTimeout(() => { fl.style.opacity = '0'; }, 900);

    setTimeout(() => {
      document.getElementById('sub').classList.add('on');
    }, 500);

    setTimeout(() => {
      document.getElementById('card').classList.add('on');
    }, 1100);

    setTimeout(startFloatingHearts, 1600);
  }

  // ── Replay Galaxy Animation ──────────────────────────────────
  function replayAnimation() {
    t0 = performance.now();
    formed = false;
    document.getElementById('sub').classList.remove('on');
    document.getElementById('card').classList.remove('on');
    const fl = document.getElementById('flash');
    fl.style.opacity = '0.5';
    setTimeout(() => { fl.style.opacity = '0'; }, 500);
  }
  document.getElementById('replayBtn').addEventListener('click', replayAnimation);

  // ── Romantic Floating Hearts ─────────────────────────────────
  const HEARTS = ['💖', '💕', '💗', '💓', '💞', '💝', '✨', '💫', '⭐', '🌸'];
  let heartsStarted = false;

  function spawnHeart() {
    const e = document.createElement('div');
    e.className = 'heart';
    e.textContent = HEARTS[(Math.random() * HEARTS.length) | 0];
    Object.assign(e.style, {
      left: (Math.random() * 92 + 4) + 'vw',
      bottom: '-35px',
      fontSize: (12 + Math.random() * 20) + 'px',
      animationDuration: (7.5 + Math.random() * 9.5) + 's',
      animationDelay: (Math.random() * 1.5) + 's',
      filter: 'drop-shadow(0 0 8px rgba(255, 120, 200, 0.6))'
    });
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 20000);
  }

  function startFloatingHearts() {
    if (heartsStarted) return;
    heartsStarted = true;
    for (let i = 0; i < 10; i++) {
      setTimeout(spawnHeart, i * 400);
    }
    setInterval(spawnHeart, 1300);
  }

  // ── Realistic Shooting Stars ─────────────────────────────────
  function launchShootingStar() {
    const el = document.createElement('div');
    const len = 70 + Math.random() * 140;
    const ang = 18 + Math.random() * 40;
    Object.assign(el.style, {
      position: 'fixed',
      pointerEvents: 'none',
      zIndex: '4',
      width: len + 'px',
      height: '1.6px',
      borderRadius: '2px',
      background: 'linear-gradient(to right, rgba(255,255,255,1), rgba(220,180,255,0.4), transparent)',
      left: (Math.random() * 80) + 'vw',
      top: (Math.random() * 45) + 'vh',
      transform: `rotate(${ang}deg)`,
      transformOrigin: 'left center',
      boxShadow: '0 0 8px rgba(255,255,255,0.8)'
    });
    document.body.appendChild(el);
    el.animate([
      { opacity: 1, marginLeft: '0px' },
      { opacity: 0, marginLeft: (300 + Math.random() * 450) + 'px' }
    ], {
      duration: 420 + Math.random() * 650,
      easing: 'cubic-bezier(0.25, 1, 0.5, 1)'
    }).onfinish = () => el.remove();
  }
  setTimeout(launchShootingStar, 600);
  setInterval(launchShootingStar, 3400);

  // ── Interactive Stardust Sparkle Trails (Touch & Mouse) ──────
  function createSparkle(x, y) {
    const el = document.createElement('div');
    el.className = 'sparkle';
    const size = 6 + Math.random() * 7;
    const colors = ['#fff', '#ffd2ef', '#ffe8a3', '#cbb4ff', '#ff85b8', '#8cd2ff'];
    const col = colors[(Math.random() * colors.length) | 0];
    Object.assign(el.style, {
      left: x + 'px',
      top: y + 'px',
      width: size + 'px',
      height: size + 'px',
      background: col,
      boxShadow: `0 0 ${size * 2.2}px ${col}`,
      opacity: '0.95',
      transform: 'translate(-50%, -50%) scale(1)',
      transition: 'transform 0.85s ease-out, opacity 0.85s ease-out'
    });
    document.body.appendChild(el);
    requestAnimationFrame(() => {
      const dx = (Math.random() - 0.5) * 44;
      const dy = (Math.random() - 0.5) * 44 - 14;
      el.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`;
      el.style.opacity = '0';
    });
    setTimeout(() => el.remove(), 900);
  }

  let lastSparkleTime = 0;
  function handlePointer(x, y) {
    const now = performance.now();
    if (now - lastSparkleTime > 32) { // Smooth ~30fps throttle
      createSparkle(x, y);
      lastSparkleTime = now;
    }
  }
  window.addEventListener('pointermove', e => handlePointer(e.clientX, e.clientY));
  window.addEventListener('touchmove', e => {
    if (e.touches[0]) handlePointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  // ── Pure Web Audio API Romantic Ambient Melody ───────────────
  let audioCtx = null;
  let isMusicPlaying = false;
  let musicTimer = null;
  const musicBtn = document.getElementById('musicBtn');

  // Pentatonic romantic chord progression (C, G, Am, F)
  const CHORDS = [
    [261.63, 329.63, 392.00, 523.25], // C major (C4, E4, G4, C5)
    [220.00, 261.63, 329.63, 440.00], // A minor (A3, C4, E4, A4)
    [174.61, 261.63, 329.63, 440.00], // F maj7 (F3, C4, E4, A4)
    [196.00, 246.94, 293.66, 392.00], // G major (G3, B3, D4, G4)
  ];
  let chordIndex = 0;

  function playTone(freq, duration, gainVal = 0.08, type = 'sine') {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(gainVal, audioCtx.currentTime + 0.35);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  function playNextChord() {
    if (!isMusicPlaying || !audioCtx) return;
    const chord = CHORDS[chordIndex % CHORDS.length];
    chordIndex++;

    // Play lush background pad notes
    chord.forEach((note, idx) => {
      setTimeout(() => {
        if (isMusicPlaying) playTone(note, 4.2, 0.04, 'sine');
      }, idx * 160);
    });

    // Play sparkling chime arpeggio
    const sparkles = [523.25, 659.25, 783.99, 880.00, 1046.50];
    for (let i = 0; i < 3; i++) {
      setTimeout(() => {
        if (!isMusicPlaying) return;
        const spFreq = sparkles[(Math.random() * sparkles.length) | 0];
        playTone(spFreq, 2.2, 0.03, 'triangle');
      }, 700 + i * 850);
    }
  }

  function toggleMusic() {
    if (!audioCtx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioCtx();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    isMusicPlaying = !isMusicPlaying;
    if (isMusicPlaying) {
      musicBtn.classList.add('playing');
      playNextChord();
      musicTimer = setInterval(playNextChord, 3800);
    } else {
      musicBtn.classList.remove('playing');
      clearInterval(musicTimer);
    }
  }
  musicBtn.addEventListener('click', toggleMusic);

  // ── Font Loading & Smooth Initialization ─────────────────────
  async function init() {
    try {
      // Ensure Google fonts are ready before canvas sampling
      await document.fonts.ready;
    } catch(e) {}

    cachedTextData = sampleTextExact('Nabila');
    const targets = computeTargetPositions(cachedTextData.normPts, cachedTextData.textAspect);
    buildScene(targets);
    requestAnimationFrame(loop);
  }

  // Start initialization
  init();

  </script>
</body>
